name: Build SK-D840N ImmortalWrt rootfs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout SK-D840N toolkit
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex gawk gettext gcc-multilib g++-multilib git libgnutls28-dev \
            gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev lld llvm make mkisofs nano ninja-build p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils rsync squashfs-tools subversion swig \
            texinfo uglifyjs unzip wget xxd zstd mtd-utils

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/immortalwrt/dl
          key: sk-d840n-immortalwrt-24.10-dl-${{ hashFiles('immortalwrt.config') }}
          restore-keys: |
            sk-d840n-immortalwrt-24.10-dl-

      - name: Build rootfs
        env:
          SK_SOURCE: ${{ github.workspace }}
          IMMORTAL_DIR: ${{ runner.temp }}/immortalwrt
          DIST_DIR: ${{ github.workspace }}/dist
          BRANCH: openwrt-24.10
          JOBS: 4
        run: |
          chmod +x build-immortalwrt-rootfs.sh
          ./build-immortalwrt-rootfs.sh

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: SK-D840N-ImmortalWrt-rootfs
          path: dist/
          if-no-files-found: error
          retention-days: 30
