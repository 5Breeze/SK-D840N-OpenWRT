name: Build SK-D840N OpenWrt with PassWall

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          build-essential clang flex bison g++ gawk gcc-multilib gettext \
          git libncurses-dev libssl-dev python3-setuptools qemu-user-static \
          rsync swig unzip zlib1g-dev file wget curl mtd-utils zstd

    - name: Compile PassWall IPKs and install into rootfs
      run: |
        chmod +x scripts/build_passwall_rootfs.sh
        ./scripts/build_passwall_rootfs.sh

    - name: Package and verify firmware
      run: |
        ./scripts/pack_to_jffs2.sh
        max_size=$((0x0f100000))
        actual_size=$(stat -c %s rootfs.jffs2)
        if (( actual_size > max_size )); then
          echo "rootfs.jffs2 is ${actual_size} bytes; NAND partition is ${max_size} bytes" >&2
          exit 1
        fi
        chmod +x scripts/pack_sysupgrade.sh
        ./scripts/pack_sysupgrade.sh
        mkdir -p dist/ipk
        find .build-passwall/sdk/bin -type f -name '*.ipk' \
          \( -name '*passwall*' -o -name 'xray-core_*' -o -name 'luci-*argon*' \) \
          -exec cp {} dist/ipk/ \;
        cp binary/* tools/* rootfs.jffs2 openwrt-24.10.8-sk-d840n-sysupgrade.tar dist/
        cp FLASHING.zh-CN.md dist/
        (cd dist && zip -rq ../firmware-SK-D840N-passwall.zip .)

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: SK-D840N-OpenWrt-24.10.8-PassWall
        path: firmware-SK-D840N-passwall.zip
        if-no-files-found: error

    - name: Check if the event is a tag push
      id: check_tag_push
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "Is tag push"
          echo "IS_TAG_PUSH=true" >> $GITHUB_OUTPUT
        else
          echo "IS_TAG_PUSH=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      if: steps.check_tag_push.outputs.IS_TAG_PUSH == 'true'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      if: steps.check_tag_push.outputs.IS_TAG_PUSH == 'true'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: firmware-SK-D840N-passwall.zip
        asset_name: firmware_SK-D840N_PassWall_${{ github.ref_name }}.zip
        asset_content_type: application/zip
